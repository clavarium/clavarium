# publish.yml -- the server, as the npm package "clavarium", with no stored
# token (trusted publishing, OIDC) and with provenance: each installation
# checks that what it updates to was built here (deploy/updater.mjs).
#
# TWO BRANCHES. "next" publishes the versions to try (with a "-": 1.3.0-next.1,
# under the tag "next"); "main" publishes the versions for everybody, and only
# them. main is moved to a commit of next that was validated, never given a
# commit of its own: what everybody gets is what was tried, byte for byte. So a
# version without "-" on next is not published from there (main will), and a
# version with "-" on main is refused: a forgotten "-" can no longer send a
# version nobody tried to everybody.
#
# On every push to main or next: the gate first (the checks a GitHub runner can run,
# and the unit tests); then the declared version is looked up on the
# registry, and only a version that is not online is published -- from the
# repository root, with the lock file as npm-shrinkwrap.json so that every
# installation gets exactly the dependencies tested here. A version with a
# "-" (1.3.0-next.1) goes out under the tag "next": only installations on
# the "next" channel see it. The end-to-end tests need a browser and a
# machine of their own: they are run before a version is set (npm run check).
#
# THE RELAY'S PROGRAM, relay/, is a package of its own, "clavarium-relay",
# with its own version (it moves only when the relay changes): published the
# same way, from relay/, when its declared version is not online -- BEFORE
# the server, so that no published Clavarium names a relay version that is
# not on the registry (deploy/relay.sh, RELAY_VERSION).
#
# Set up once on npmjs.com, for EACH package (clavarium, clavarium-relay):
# Settings > Trusted publishing > GitHub Actions, organisation "clavarium",
# repository "clavarium", workflow "publish.yml" -- the exact file name.
name: publish

on:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Trusted publishing needs npm 11.5.1 or later
        run: |
          set -eu
          at_least() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n 1)" = "$2" ]; }
          v="$(npm -v)"; at_least "$v" 11.5.1 || npm install -g npm@11
          npm -v
      - name: What the tests use
        run: sudo apt-get install -y -qq tmux >/dev/null
      - name: Dependencies, as the lock file has them
        run: npm ci --no-audit --no-fund
      - name: Parley's archive for the machines, checked against the lock file
        run: npm run toolbox
      - name: Gate -- the checks a runner can make, and the unit tests
        run: |
          set -eu
          npm run check:hooks
          npm run check:shapes
          npm run check:names
          npm run check:shell
          npm test
      - name: Is this version of the relay's program online already?
        id: relay
        working-directory: relay
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          status=0; out="$(npm view "clavarium-relay@${version}" version 2>&1)" || status=$?
          if [ "$status" -eq 0 ] && [ -n "$out" ]; then echo "publish=no" >> "$GITHUB_OUTPUT"; echo "::notice::clavarium-relay@${version} is online already"
          elif printf '%s' "$out" | grep -q E404; then echo "publish=yes" >> "$GITHUB_OUTPUT"; echo "::notice::publishing clavarium-relay@${version}"
          else echo "::error::the registry did not answer: $out"; exit 1; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # The branch says what may go out (see the top of this file); the last "publish" said counts.
          case "${GITHUB_REF_NAME}:${version}" in
            main:*-*) echo "::error::clavarium-relay@${version} is a version to try: it goes out from next, never from main"; exit 1 ;;
            next:*-*|main:*) : ;;
            next:*) echo "::notice::clavarium-relay@${version} is for everybody: published from main once main is moved here"; echo "publish=no" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::published from main or next only, not from ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
      - name: The relay's package holds its program, and nothing else
        if: steps.relay.outputs.publish == 'yes'
        working-directory: relay
        run: |
          set -eu
          npm pack --dry-run --json > ../relay-pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("../relay-pack.json", "utf8"))[0].files.map((f) => f.path).sort();
            if (JSON.stringify(files) !== JSON.stringify(["README.md", "clavarium-relay", "package.json"])) { console.error("relay package:", files); process.exit(1); }'
          rm -f ../relay-pack.json
          bash -n clavarium-relay
      - name: Publish the relay's program
        if: steps.relay.outputs.publish == 'yes'
        working-directory: relay
        run: |
          set -eu
          case "${{ steps.relay.outputs.version }}" in
            *-*) npm publish --provenance --tag next ;;
            *)   npm publish --provenance ;;
          esac
      - name: Is this version online already?
        id: target
        run: |
          set -eu
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          status=0; out="$(npm view "${name}@${version}" version 2>&1)" || status=$?
          if [ "$status" -eq 0 ] && [ -n "$out" ]; then echo "publish=no" >> "$GITHUB_OUTPUT"; echo "::notice::${name}@${version} is online already"
          elif printf '%s' "$out" | grep -q E404; then echo "publish=yes" >> "$GITHUB_OUTPUT"; echo "::notice::publishing ${name}@${version}"
          else echo "::error::the registry did not answer: $out"; exit 1; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # The same rule as for the relay (see the top of this file).
          case "${GITHUB_REF_NAME}:${version}" in
            main:*-*) echo "::error::${name}@${version} is a version to try: it goes out from next, never from main"; exit 1 ;;
            next:*-*|main:*) : ;;
            next:*) echo "::notice::${name}@${version} is for everybody: published from main once main is moved here"; echo "publish=no" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::published from main or next only, not from ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
      - name: The package holds what a server needs, and nothing else
        if: steps.target.outputs.publish == 'yes'
        run: |
          set -eu
          npm shrinkwrap
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path);
            const need = ["package.json", "npm-shrinkwrap.json", "LICENSE", "README.md", "server/main.mjs", "server/smoke.mjs", "web/index.html", "config/tools.json", "deploy/install.sh", "deploy/updater.mjs", "deploy/clavarium-host"];
            const missing = need.filter((f) => !files.includes(f));
            const stray = files.filter((f) => !/^(server|web|config|deploy)\//.test(f) && !["package.json", "npm-shrinkwrap.json", "LICENSE", "README.md"].includes(f));
            if (missing.length || stray.length) { console.error("missing:", missing, "not for a server:", stray); process.exit(1); }
            console.log(files.length + " files");'
          rm -f pack.json
      - name: Publish
        if: steps.target.outputs.publish == 'yes'
        run: |
          set -eu
          case "${{ steps.target.outputs.version }}" in
            *-*) npm publish --provenance --tag next ;;
            *)   npm publish --provenance ;;
          esac
